# Déploiement GameTun API sur Render (offre gratuite).
# La base PostgreSQL peut être hébergée sur Render, Neon ou Supabase (gratuit).
# Renseigner les secrets dans le dashboard Render (jamais dans le dépôt).

services:
  - type: web
    name: gametun-api
    runtime: node
    rootDir: backend
    plan: free
    region: frankfurt
    buildCommand: npm ci && npm run prisma:generate && npm run build && npm run prisma:deploy
    startCommand: npm run start:prod
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        sync: false # à définir dans le dashboard (secret)
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL
        value: 30d
      - key: CORS_ORIGINS
        sync: false
      - key: MIN_AGE
        value: 13
