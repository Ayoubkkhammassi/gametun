# Déploiement GameTun API sur Render (offre gratuite).
# La base PostgreSQL peut être hébergée sur Render, Neon ou Supabase (gratuit).
# Renseigner les secrets dans le dashboard Render (jamais dans le dépôt).

services:
  - type: web
    name: gametun-api
    runtime: node
    rootDir: backend
    plan: free
    region: frankfurt
    # --include=dev : garde nest/prisma/tsc (NODE_ENV=production les exclurait).
    buildCommand: npm ci --include=dev && npm run prisma:generate && npm run build
    startCommand: npm run prisma:deploy && npm run start:prod
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      # PORT est fourni automatiquement par Render (ne pas le fixer).
      - key: DATABASE_URL
        sync: false # à définir dans le dashboard (secret)
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL
        value: 30d
      - key: CORS_ORIGINS
        sync: false
      - key: MIN_AGE
        value: 13
      # ID client Web Google (public) pour vérifier les connexions Google.
      - key: GOOGLE_CLIENT_ID
        value: 560455067095-1m461lg873hn29ccfg24m8ga3a74g3aa.apps.googleusercontent.com
      # Numéro D17 pour les paiements Premium manuels.
      - key: D17_NUMBER
        value: "28492755"
      # Système de mise à jour intégré (incrémenter à chaque nouvel APK).
      - key: APP_VERSION_CODE
        value: "2"
      - key: APP_VERSION_NAME
        value: "1.0.2"
      - key: PUBLIC_BASE_URL
        value: https://gametun-api.onrender.com
