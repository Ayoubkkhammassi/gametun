name: gametun
description: "GameTun — La communauté gaming tunisienne."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.6.2

  # Réseau / API
  dio: ^5.7.0

  # Stockage sécurisé des tokens (jamais de secret en clair)
  flutter_secure_storage: ^9.2.2

  # Cache local léger (mode hors ligne)
  shared_preferences: ^2.3.3

  # Typographie premium
  google_fonts: ^6.2.1

  # Chat temps réel (WebSocket)
  socket_io_client: ^3.0.2

  # Messages vocaux : enregistrement + lecture
  record: ^6.0.0
  audioplayers: ^6.1.0
  path_provider: ^2.1.5

  # Photo de profil (galerie / caméra)
  image_picker: ^1.1.2

  # Connexion Google
  google_sign_in: ^6.2.2

  # Mise à jour intégrée (ouvre le lien de téléchargement + installe l'APK)
  url_launcher: ^6.3.1
  open_filex: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

# Icône de l'app (logo GameTun)
flutter_launcher_icons:
  android: true
  image_path: "assets/icon/gametun.png"
  adaptive_icon_background: "#07060D"
  adaptive_icon_foreground: "assets/icon/gametun.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icon/gametun.png
    - assets/cards/
    - assets/anim/
