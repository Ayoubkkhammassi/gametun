name: gametun
description: "GameTun — La communauté gaming tunisienne."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.6.2

  # Réseau / API
  dio: ^5.7.0

  # Stockage sécurisé des tokens (jamais de secret en clair)
  flutter_secure_storage: ^9.2.2

  # Cache local léger (mode hors ligne)
  shared_preferences: ^2.3.3

  # Typographie premium
  google_fonts: ^6.2.1

  # Chat temps réel (WebSocket)
  socket_io_client: ^3.0.2

  # Messages vocaux : enregistrement + lecture
  record: ^6.0.0
  audioplayers: ^6.1.0
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
